name: Build APK e publicar no Releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_BUNDLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Build web
        run: npm run build

      - name: Gerar projeto Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vegiamap.apk

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: VegiaMap ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          files: vegiamap.apk
